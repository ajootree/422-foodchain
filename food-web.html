<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>먹이그물 탐정</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',sans-serif;color:#283b48;background:#edf5f1}button{font:inherit;cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}.app{height:100dvh;min-height:440px;display:grid;grid-template-columns:220px 1fr;gap:16px;padding:20px;background:radial-gradient(circle at 90% 10%,#fff5cc,transparent 40%),#e4f0e9}aside{background:#fffaf0;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 5px 0 #cedcd3}h1{font-size:27px;margin:0}p{line-height:1.6;margin:0}.badge{color:#648b75;font-weight:bold;font-size:13px}.progress{display:flex;gap:7px}.dot{width:22px;height:22px;background:#e0e5df;border-radius:50%}.dot.done{background:#e8ae43}.dot.current{background:#72ad94;outline:3px solid #c5dfd0}.stat{background:#f1e9d9;border-radius:16px;padding:14px}.stat strong{font-size:30px;display:block}.primary{background:#32775e;color:white;padding:13px 18px;border-radius:14px;font-weight:bold;box-shadow:0 4px 0 #20503f}.secondary{background:#e5ede8;color:#345b49;padding:11px;border-radius:12px}.help{margin-top:auto;font-size:13px;color:#65766b}main{min-width:0;display:flex;flex-direction:column;gap:12px}.top{background:#ffffffba;border-radius:18px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top h2{margin:0;font-size:23px}.pill{background:#fff1c7;padding:9px 15px;border-radius:30px;white-space:nowrap;font-weight:bold}.board{position:relative;flex:1;min-height:260px;border:4px solid #fff;border-radius:27px;background:linear-gradient(#f8fcff,#eef6e8);overflow:hidden;box-shadow:0 6px 0 #cbdcd1}.board:before{content:'🌳';position:absolute;bottom:-25px;right:3%;font-size:160px;opacity:.1}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{pointer-events:stroke;cursor:pointer;stroke:#547c95;stroke-width:4;fill:none}.edge.wrong{stroke:#da7771;stroke-dasharray:9 6}.edge.alternate{stroke:#e8aa35;stroke-width:7}.card{position:absolute;transform:translate(-50%,-50%);width:116px;height:110px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #cddbd3;border:3px solid #e0eae4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:bold;z-index:2}.card .emoji{font-size:44px;line-height:1.2}.card.selected{border-color:#f2b943;background:#fff4d4;box-shadow:0 0 0 6px #f8d97766}.card.gone{opacity:.3;filter:grayscale(1)}.card.target{border-color:#dfa847}.card.correct{background:#fff0bb;border-color:#e8aa35}.bottom{min-height:56px;background:#fffaf0;border-radius:17px;padding:10px 18px;display:flex;gap:14px;justify-content:space-between;align-items:center}.message{font-weight:bold;line-height:1.5}.overlay{position:fixed;inset:0;background:#203831b8;z-index:10;display:grid;place-items:center;padding:20px}.modal{width:min(530px,95vw);background:#fffaf0;padding:30px;border-radius:28px;text-align:center;box-shadow:0 12px 0 #0002}.modal h2{font-size:28px;margin:12px 0}.modal p{margin:15px 0 22px}.steps{display:flex;justify-content:center;gap:20px;margin:20px 0}.steps span{background:#e9efe5;padding:12px;border-radius:15px}.tutorial-focus{z-index:12;box-shadow:0 0 0 7px #ffda6f}.coach{position:fixed;z-index:13;top:22px;left:50%;transform:translateX(-50%);background:#fff4d5;padding:15px 24px;border-radius:20px;box-shadow:0 5px 0 #0002;text-align:center;max-width:90vw;font-weight:bold}.hidden{display:none!important}@media(max-height:650px){.app{padding:12px;gap:12px}aside{padding:16px;gap:12px}.card{width:100px;height:88px}.card .emoji{font-size:36px}.top{padding:10px 18px}}@media(max-width:800px){.app{grid-template-columns:160px 1fr;padding:10px;gap:10px}aside{padding:14px}h1{font-size:23px}.top h2{font-size:18px}.card{width:86px;height:84px}.card .emoji{font-size:32px}.pill{font-size:13px;padding:8px}.bottom{font-size:14px}}@media(max-width:550px){.app{height:auto;min-height:100dvh;grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}aside h1{font-size:20px}.stat,.help{display:none}.board{height:430px;flex:auto}.top{flex-wrap:wrap}.card{width:80px}.bottom{flex-wrap:wrap}}

.card.hit{animation:happy .7s ease;background:#dcffe5;border-color:#42b879}.card.miss{animation:shake .45s ease;border-color:#ed7777;background:#ffe4e2}.effect-icon{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:35px;pointer-events:none;animation:iconpop .9s ease both;z-index:4}.feedback-line{stroke:#38b77a;stroke-width:7;stroke-dasharray:14 9;animation:flow .7s linear infinite;pointer-events:none;fill:none}.feedback-line.reverse{stroke:#e7ae32}.edge.fresh{stroke:#38b77a;stroke-width:6;animation:linepop .7s ease}.card.target{animation:targetpulse 1.2s ease infinite}.pill.complete{animation:happy .7s;background:#d9ffe4} @keyframes happy{0%,100%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.14)}70%{transform:translate(-50%,-50%) scale(.98)}}@keyframes shake{0%,100%{translate:0}20%,60%{translate:-9px}40%,80%{translate:9px}}@keyframes iconpop{0%{opacity:0;translate:0 12px;scale:.5}25%{opacity:1;scale:1.2}75%{opacity:1}100%{opacity:0;translate:0 -15px}}@keyframes flow{to{stroke-dashoffset:-46}}@keyframes linepop{0%{opacity:.2;stroke-width:12}100%{opacity:1;stroke-width:6}}@keyframes targetpulse{50%{box-shadow:0 0 0 9px #f3c44c55}} .pill.complete{animation:none}

.bottom{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;min-height:0;width:min(340px,85%);padding:25px 28px;flex-direction:column;gap:16px;text-align:center;background:rgba(255,253,239,.91);border:2px solid rgba(255,255,255,.95);box-shadow:0 10px 35px #46695126;border-radius:26px;backdrop-filter:blur(8px);animation:popup-in .25s ease-out}.bottom .message{font-size:25px}.bottom .message small{display:block;font-size:17px;color:#74876b;margin-top:8px}.bottom .primary{min-width:190px}.bottom.is-hidden{display:none}@keyframes popup-in{from{opacity:0;scale:.9}to{opacity:1;scale:1}}@media(max-height:550px){.bottom{padding:18px;gap:10px}.bottom .message{font-size:23px}}

.card.gone{opacity:.5}.card.gone:after{content:'✕';position:absolute;font-size:70px;color:#df7065;inset:0;display:grid;place-items:center;text-shadow:0 2px white}.card.target:before{content:'배고파요!';position:absolute;bottom:calc(100% + 10px);white-space:nowrap;background:#fff1c1;color:#775721;padding:8px 13px;border-radius:15px;font-size:15px;box-shadow:0 3px 0 #e4cd8d}.overlay.quiz-transition{background:#e8f1e777;backdrop-filter:blur(3px)}.quiz-transition .modal{background:#fffcf0ed;border:3px solid white;box-shadow:0 10px 35px #315a4426}.scene{display:flex;justify-content:center;align-items:center;gap:24px;margin:22px 0}.scene-animal{font-size:66px;position:relative}.scene-animal.removed{filter:grayscale(1);opacity:.5}.scene-animal.removed:after{content:'✕';position:absolute;inset:0;color:#dc5c5c;font-size:72px;filter:none}.scene-question{font-size:42px}.scene-label{font-size:16px;font-weight:bold;margin-top:8px}.scene-hungry{animation:hungry-bounce .8s ease infinite alternate}@keyframes hungry-bounce{to{translate:0 -6px}}

.hint-panel{position:absolute;z-index:7;top:12px;left:50%;transform:translateX(-50%);width:min(420px,92%);padding:16px 20px;border-radius:20px;background:#fff5ddeb;border:2px solid white;box-shadow:0 5px 20px #4c664522;text-align:center;backdrop-filter:blur(5px)}.hint-panel p{font-size:17px;font-weight:bold;margin-bottom:12px}.hint-panel button{padding:9px 14px;margin:0 4px}.card.hint-glow{border-color:#eab22c;animation:hint-glow 1s ease infinite}@keyframes hint-glow{50%{box-shadow:0 0 0 10px #ffd65d66}}
</style>
<div class="app"><aside><div class="badge">생태계 연결 퀴즈</div><h1>🌿 먹이그물<br>탐정</h1><div class="progress" id="progress"></div><div class="stat">탐정 별<strong id="score">⭐ 0</strong></div><button class="secondary" id="hint">💡 힌트</button><button class="secondary" id="help">연결 방법</button><button class="secondary" id="restart">처음으로</button><p class="help">화살표는<br><b>먹히는 생물 → 먹는 생물</b><br>연결선을 누르면 지워져요.</p></aside><main><div class="top"><div><div class="badge" id="roundLabel"></div><h2 id="title"></h2></div><div class="pill" id="count"></div></div><div class="board" id="board"><svg id="lines"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547c95"/></marker><marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#e8aa35"/></marker></defs><g id="edges"></g></svg></div><div class="bottom"><div class="message" id="message" aria-live="polite"></div><button class="primary" id="action">먹이 관계를 연결해요</button></div></main></div>
<div id="overlay" class="overlay"><div class="modal" id="modal"></div></div><div id="shade" class="overlay hidden"></div><div id="coach" class="coach hidden"></div>
<script>
const species={rice:['🌾','벼'],clover:['☘️','토끼풀'],hopper:['🦗','메뚜기'],larva:['🐛','애벌레'],frog:['🐸','개구리'],sparrow:['🐦','참새'],snake:['🐍','뱀'],rabbit:['🐇','토끼'],eagle:['🦅','검독수리']};
// 지도서의 먹이 카드에 제시된 관계를 바탕으로 구성한 부분 먹이그물.
const rounds=[
{title:'풀밭의 작은 먹이그물',ids:['rice','clover','hopper','larva','frog'],pairs:[['rice','hopper'],['clover','hopper'],['rice','larva'],['clover','larva'],['hopper','frog'],['larva','frog']],gone:'hopper',target:'frog',alternatives:['larva']},
{title:'참새도 함께 살아요',ids:['rice','hopper','larva','frog','sparrow'],pairs:[['rice','hopper'],['rice','larva'],['rice','sparrow'],['hopper','frog'],['larva','frog'],['hopper','sparrow'],['larva','sparrow']],gone:'larva',target:'sparrow',alternatives:['rice','hopper']},
{title:'뱀의 다른 먹이를 찾아요',ids:['clover','larva','frog','sparrow','snake'],pairs:[['clover','larva'],['larva','frog'],['larva','sparrow'],['frog','snake'],['sparrow','snake']],gone:'frog',target:'snake',alternatives:['sparrow']},
{title:'풀밭에서 하늘까지',ids:['rice','clover','hopper','rabbit','sparrow','eagle'],pairs:[['rice','hopper'],['clover','hopper'],['rice','rabbit'],['clover','rabbit'],['rice','sparrow'],['hopper','sparrow'],['rabbit','eagle'],['sparrow','eagle']],gone:'rabbit',target:'eagle',alternatives:['sparrow']},
{title:'복잡하게 얽힌 먹이그물',ids:['rice','hopper','larva','frog','sparrow','snake','eagle'],pairs:[['rice','hopper'],['rice','larva'],['rice','sparrow'],['hopper','frog'],['larva','frog'],['hopper','sparrow'],['larva','sparrow'],['frog','snake'],['sparrow','snake'],['sparrow','eagle'],['snake','eagle']],gone:'sparrow',target:'snake',alternatives:['frog']}
];
let hintLevel=0;let index=0,links=[],selected=null,phase='connect',score=0,wrong=[],tutorial=-1;
const $=id=>document.getElementById(id), key=p=>p.join('>');
function positions(n){return n===5?[[18,24],[18,76],[50,24],[50,76],[82,50]]:n===6?[[16,25],[16,75],[49,25],[49,75],[82,25],[82,75]]:[[13,50],[36,22],[36,78],[62,22],[62,78],[86,22],[86,78]]}
function render(){document.querySelector('.hint-panel')?.remove();hintLevel=0;const r=rounds[index];$('roundLabel').textContent=`ROUND ${index+1} / ${rounds.length}`;$('title').textContent=r.title;$('score').textContent=`⭐ ${score}`;$('progress').innerHTML=rounds.map((_,i)=>`<span class="dot ${i<index?'done':i===index?'current':''}"></span>`).join('');$('count').textContent=phase==='connect'?`연결 ${links.length} / ${r.pairs.length}개`:'다른 먹이 찾기';$('board').querySelectorAll('.card').forEach(e=>e.remove());const pos=positions(r.ids.length);r.ids.forEach((id,i)=>{const b=document.createElement('button');b.className='card'+(selected===id?' selected':'')+((phase==='alternate'||phase==='next')&&id===r.gone?' gone':'')+((phase==='alternate'||phase==='next')&&id===r.target?' target':'');b.style.left=pos[i][0]+'%';b.style.top=pos[i][1]+'%';b.dataset.id=id;b.innerHTML=`<span class="emoji">${species[id][0]}</span><span>${species[id][1]}</span>`;b.setAttribute('aria-label',species[id][1]);b.disabled=phase==='next'||phase==='ready'||(phase==='alternate'&&id===r.gone);b.onclick=()=>pick(id);$('board').append(b)});draw();$('action').textContent=phase==='connect'?'먹이 관계를 연결해요':phase==='ready'?'다른 먹이 찾기':phase==='alternate'?'먹이를 골라 주세요':'다음 라운드';$('action').disabled=phase==='alternate'||phase==='connect';$('hint').disabled=tutorial>=0||phase==='ready'||phase==='next';document.querySelector('.bottom').classList.toggle('is-hidden',phase!=='ready'&&phase!=='next');if(phase==='alternate')$('title').textContent=species[r.gone][1]+'가 사라졌어요! '+species[r.target][1]+'의 다른 먹이는?';}
function draw(){const r=rounds[index],pos=positions(r.ids.length),w=$('board').clientWidth,h=$('board').clientHeight; $('lines').setAttribute('viewBox',`0 0 ${w} ${h}`);$('edges').innerHTML='';if(phase==='alternate'||phase==='next')return;links.forEach(p=>{if((phase==='alternate'||phase==='next')&&p.includes(r.gone))return;const a=pos[r.ids.indexOf(p[0])],b=pos[r.ids.indexOf(p[1])];let x=a[0]*w/100,y=a[1]*h/100,xx=b[0]*w/100,yy=b[1]*h/100;const dx=xx-x,dy=yy-y,len=Math.hypot(dx,dy),pad=Math.min(w<650?55:70,len*.3);x+=dx/len*pad;y+=dy/len*pad;xx-=dx/len*pad;yy-=dy/len*pad;const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.dataset.key=key(p);line.setAttribute('d',`M${x} ${y} L${xx} ${yy}`);line.setAttribute('marker-end','url(#arrow)');line.setAttribute('class','edge'+(wrong.includes(key(p))?' wrong':''));line.onclick=()=>{if(phase!=='connect'||tutorial>=0)return;links=links.filter(q=>key(q)!==key(p));selected=null;wrong=[];render();say('연결을 지웠어요. 다시 이어 보세요.');};$('edges').append(line)})}
function effect(ids,kind){ids.forEach(id=>{const card=$('board').querySelector(`[data-id="${id}"]`);if(!card)return;card.classList.remove('hit','miss');void card.offsetWidth;card.classList.add(kind==='bad'?'miss':'hit');const icon=document.createElement('span');icon.className='effect-icon';icon.textContent=kind==='bad'?'✖️':kind==='reverse'?'🔄':'✨';card.append(icon);setTimeout(()=>{icon.remove();card.classList.remove('hit','miss')},1000)});}
function flowPair(pair,reverse=false){const cards=pair.map(id=>$('board').querySelector(`[data-id="${id}"]`));if(cards.some(c=>!c))return;const board=$('board').getBoundingClientRect(),a=cards[0].getBoundingClientRect(),b=cards[1].getBoundingClientRect();const x=a.left+a.width/2-board.left,y=a.top+a.height/2-board.top,xx=b.left+b.width/2-board.left,yy=b.top+b.height/2-board.top,dx=xx-x,dy=yy-y,len=Math.hypot(dx,dy),pad=60;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x+dx/len*pad} ${y+dy/len*pad} L${xx-dx/len*pad} ${yy-dy/len*pad}`);path.setAttribute('class','feedback-line'+(reverse?' reverse':''));path.setAttribute('marker-end',reverse?'url(#gold)':'url(#arrow)');$('edges').append(path);setTimeout(()=>path.remove(),1800);}
function say(t){if(phase==='ready')$('message').innerHTML='🎉 먹이그물 완성!<small>⭐ +3</small>';else if(phase==='next')$('message').innerHTML='✨ 다른 먹이 발견!<small>⭐ +1</small>';else $('message').textContent=t;}
function pick(id){const r=rounds[index];if(tutorial>=0){tutorialPick(id);return}if(phase==='alternate'){if(r.alternatives.includes(id)){phase='next';score++;render();const b=$('board').querySelector(`[data-id="${id}"]`);b.classList.add('correct');effect([id,r.target],'good');flowPair([id,r.target]);say(`맞아요! ${species[r.target][1]}는 ${species[id][1]}도 먹을 수 있어요. ⭐ +1`);$('action').textContent=index===rounds.length-1?'탐정 기록 보기':'다음 라운드';}else {effect([id],'bad');say('남아 있는 생물 중 먹을 수 있는 다른 먹이를 찾아보세요.');}return}if(phase!=='connect')return;if(selected===id){selected=null;render();return}if(!selected){selected=id;render();say(`${species[id][1]}를 먹는 생물을 눌러 주세요.`);return}const p=[selected,id];if(links.some(q=>key(q)===key(p))){say('이미 연결한 관계예요.');selected=null;render();return}selected=null;wrong=[];const valid=r.pairs.some(q=>key(q)===key(p));if(!valid){render();const reverse=r.pairs.some(q=>q[0]===p[1]&&q[1]===p[0]);effect(p,reverse?'reverse':'bad');if(reverse)flowPair([p[1],p[0]],true);say(reverse?'화살표가 반대예요! 먹히는 생물 → 먹는 생물 순서로 눌러요.':'다시 생각해 보세요. 이 두 생물은 이 방향의 먹이 관계로 연결되지 않아요.');return}links.push(p);if(links.length===r.pairs.length){phase='ready';score+=3;}render();effect(p,'good');flowPair(p);const fresh=$('edges').querySelector(`[data-key="${key(p)}"]`);if(fresh)fresh.classList.add('fresh');if(phase==='ready')$('count').textContent='🎉 모두 찾았어요!';say(phase==='ready'?`맞아요! ${species[p[1]][1]}의 먹이는 ${species[p[0]][1]}! 모든 연결을 찾았어요. ⭐ +3`:`맞아요! ${species[p[1]][1]}의 먹이는 ${species[p[0]][1]}! 남은 ${r.pairs.length-links.length}개도 찾아보세요.`);}
function check(){const r=rounds[index];if(phase==='next'){if(index===rounds.length-1){finish();return}index++;links=[];selected=null;phase='connect';wrong=[];render();say(`먹이 관계 ${rounds[index].pairs.length}개를 찾아보세요.`);return}if(phase!=='ready')return;phase='alternate';selected=null;render();say(`${species[r.gone][1]}가 사라졌어요! ${species[r.target][1]}가 먹을 수 있는 다른 먹이를 눌러 주세요.`);showChange();}
function showChange(){const r=rounds[index];$('overlay').classList.add('quiz-transition');$('overlay').classList.remove('hidden');$('modal').innerHTML=`<div class="badge">추가 퀴즈</div><h2>${species[r.gone][1]}가 사라졌어요!</h2><div class="scene"><div><div class="scene-animal removed">${species[r.gone][0]}</div><div class="scene-label">${species[r.gone][1]}</div></div><div class="scene-question">→</div><div><div class="scene-animal scene-hungry">${species[r.target][0]}</div><div class="scene-label">배고파요! 💭</div></div></div><p><b>${species[r.target][1]}는 이제 뭘 먹을까요?</b></p><button class="primary" id="findFood">다른 먹이 찾아주기</button>`;$('findFood').onclick=()=>{$('overlay').classList.add('hidden');$('overlay').classList.remove('quiz-transition');const target=$('board').querySelector(`[data-id="${r.target}"]`);if(target)target.focus();};}

function welcome(){document.querySelector('.hint-panel')?.remove();$('overlay').classList.remove('quiz-transition');tutorial=-1;$('shade').classList.add('hidden');$('coach').classList.add('hidden');$('overlay').classList.remove('hidden');$('modal').innerHTML='<div style="font-size:58px">🔎🌿</div><h2>먹이그물 탐정</h2><p>누가 누구를 먹을까요?<br>카드를 연결해 숨은 먹이 관계를 찾아요.</p><div class="steps"><span>① 먹이 누르기</span><span>② 먹는 생물 누르기</span></div><button class="primary" id="start">연습하고 시작!</button>';$('start').onclick=startTutorial;}
function startTutorial(){index=0;score=0;links=[];phase='connect';selected=null;wrong=[];$('overlay').classList.add('hidden');tutorial=0;render();showTutorial();}
function showTutorial(){const visible=tutorial<2?['rice','hopper']:['rice','hopper'];$('board').querySelectorAll('.card').forEach(b=>{b.style.visibility=visible.includes(b.dataset.id)?'visible':'hidden';b.classList.toggle('tutorial-focus',b.dataset.id===(tutorial===0?'rice':'hopper'));b.disabled=b.dataset.id!==(tutorial===0?'rice':'hopper')});$('shade').classList.remove('hidden');$('coach').classList.remove('hidden');$('coach').textContent=tutorial===0?'① 먼저, 먹이가 되는 벼를 눌러요.':'② 벼를 먹는 메뚜기를 눌러요.';}
function tutorialPick(id){if(tutorial===0&&id==='rice'){selected=id;tutorial=1;render();showTutorial();return}if(tutorial===1&&id==='hopper'){tutorial=-1;links=[['rice','hopper']];selected=null;$('shade').classList.add('hidden');$('coach').classList.add('hidden');render();effect(['rice','hopper'],'good');flowPair(['rice','hopper']);say('잘했어요! 벼 → 메뚜기. 남은 5개 관계도 찾아보세요.');}}
function finish(){$('overlay').classList.remove('quiz-transition');$('overlay').classList.remove('hidden');$('modal').innerHTML=`<div style="font-size:58px">🏅</div><h2>먹이그물 탐정 완료!</h2><p>5개 먹이그물을 완성했어요.<br><b>탐정 별 ⭐ ${score} / 20</b></p><p>먹이 관계가 여러 갈래로 연결되면<br>다른 먹이를 찾을 수 있어요.</p><button class="primary" id="again">처음으로</button>`;$('again').onclick=welcome;}
function showHint(){if(tutorial>=0||!['connect','alternate'].includes(phase))return;const r=rounds[index];hintLevel=Math.min(2,hintLevel+1);document.querySelector('.hint-panel')?.remove();$('board').querySelectorAll('.hint-glow').forEach(c=>c.classList.remove('hint-glow'));let text;if(phase==='alternate'){text=hintLevel===1?`💡 ${species[r.target][0]} ${species[r.target][1]}에게 연결했던 다른 먹이를 떠올려 봐요.`:`💡 반짝이는 생물 중 ${species[r.target][1]}가 먹을 수 있는 먹이를 골라요.`;if(hintLevel===2)r.alternatives.forEach(id=>$('board').querySelector(`[data-id="${id}"]`)?.classList.add('hint-glow'));}else{const missing=r.pairs.find(p=>!links.some(q=>key(q)===key(p)));if(!missing)return;if(hintLevel===1)text=`💡 ${species[missing[1]][0]} ${species[missing[1]][1]}의 먹이를 찾아볼까요?`;else{const foods=r.pairs.filter(p=>p[1]===missing[1]&&!links.some(q=>key(q)===key(p))).map(p=>p[0]);text=`💡 반짝이는 먹이 하나 → ${species[missing[1]][0]} ${species[missing[1]][1]} 순서로 눌러요.`;foods.forEach(id=>$('board').querySelector(`[data-id="${id}"]`)?.classList.add('hint-glow'));}}const panel=document.createElement('div');panel.className='hint-panel';panel.setAttribute('role','status');const p=document.createElement('p');p.textContent=text;panel.append(p);if(hintLevel===1){const more=document.createElement('button');more.className='secondary';more.textContent='조금 더 도와줘';more.onclick=showHint;panel.append(more)}const close=document.createElement('button');close.className='primary';close.textContent='해볼게!';close.onclick=()=>panel.remove();panel.append(close);$('board').append(panel);}
$('hint').onclick=showHint;$('action').onclick=check;$('restart').onclick=welcome;$('help').onclick=()=>{if(tutorial>=0)return;$('overlay').classList.remove('hidden');$('modal').innerHTML='<h2>카드 두 개를 차례로!</h2><p><b>먹히는 생물 → 먹는 생물</b><br>예: 벼를 누르고 메뚜기를 눌러요.<br>잘못 이은 선은 눌러서 지워요.</p><button class="primary" id="close">계속하기</button>';$('close').onclick=()=>$('overlay').classList.add('hidden')};$('board').append(document.querySelector('.bottom'));new ResizeObserver(draw).observe($('board'));render();welcome();
</script></html>
